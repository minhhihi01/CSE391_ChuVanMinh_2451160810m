<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Grid Layout</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>

    <!-- MAIN GRID CONTAINER -->
    <div class="container">

        <!-- HEADER -->
        <header class="header">
            <h1>MyShop</h1>

            <nav>
                <a href="#">Home</a>
                <a href="#">Products</a>
                <a href="#">Sale</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <!-- HERO BANNER -->
        <section class="hero">
            <h2>Big Sale 50% OFF</h2>
            <p>Best deals this week!</p>
        </section>

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <h3>Filters</h3>

            <label>
                <input type="checkbox">
                Electronics
            </label>

            <label>
                <input type="checkbox">
                Fashion
            </label>

            <label>
                <input type="checkbox">
                Gaming
            </label>

            <label>
                <input type="checkbox">
                Accessories
            </label>

        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- FEATURED CARD -->
            <div class="product-card featured">
                <img src="https://picsum.photos/400/250?1" alt="">
                <h3>Featured Product</h3>
                <p>$199</p>
            </div>

            <!-- PRODUCT CARDS -->
            <div class="product-card">
                <img src="https://picsum.photos/300/200?2" alt="">
                <h3>Product 1</h3>
                <p>$50</p>
            </div>

            <div class="product-card">
                <img src="https://picsum.photos/300/200?3" alt="">
                <h3>Product 2</h3>
                <p>$60</p>
            </div>

            <div class="product-card">
                <img src="https://picsum.photos/300/200?4" alt="">
                <h3>Product 3</h3>
                <p>$70</p>
            </div>

            <div class="product-card">
                <img src="https://picsum.photos/300/200?5" alt="">
                <h3>Product 4</h3>
                <p>$80</p>
            </div>

            <div class="product-card">
                <img src="https://picsum.photos/300/200?6" alt="">
                <h3>Product 5</h3>
                <p>$90</p>
            </div>

        </main>

        <!-- ADS -->
        <aside class="ads">

            <h3>Advertisement</h3>

            <img src="https://picsum.photos/200/500?7" alt="">

        </aside>

        <!-- FOOTER -->
        <footer class="footer">
            <p>© 2026 MyShop. All rights reserved.</p>
        </footer>

    </div>

</body>
</html>
