<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Multimedia</title>
</head>
<body>

<header>
    <h1>Giới thiệu sản phẩm đa phương tiện</h1>
</header>

<main>

    <section>
        <h2>Hình ảnh sản phẩm</h2>

        <figure>
            <img src="https://placehold.co/400x300"
                 alt="Điện thoại mặt trước màu đen"
                 loading="lazy"
                 style="max-width:100%; height:auto;">
            <figcaption>Ảnh sản phẩm mặt trước</figcaption>
        </figure>

        <figure>
            <img src="https://placehold.co/400x300"
                 alt="Điện thoại mặt sau màu bạc"
                 loading="lazy"
                 style="max-width:100%; height:auto;">
            <figcaption>Ảnh sản phẩm mặt sau</figcaption>
        </figure>

        <figure>
            <img src="https://placehold.co/400x300"
                 alt="Điện thoại chụp nghiêng bên cạnh hộp"
                 loading="lazy"
                 style="max-width:100%; height:auto;">
            <figcaption>Ảnh sản phẩm góc nghiêng</figcaption>
        </figure>
    </section>

    <section>
        <h2>Video giới thiệu YouTube</h2>

        <iframe width="560" height="315"
            src="https://www.youtube.com/embed/dQw4w9WgXcQ"
            title="Video giới thiệu sản phẩm"
            allowfullscreen>
        </iframe>
    </section>

    <section>
        <h2>Video nội bộ</h2>

        <video controls
               poster="https://placehold.co/600x350"
               width="600">

            <source src="video.mp4" type="video/mp4">
            <source src="video.webm" type="video/webm">

            Trình duyệt không hỗ trợ video.
        </video>
    </section>

    <section>
        <h2>Âm thanh giới thiệu</h2>

        <audio controls>
            <source src="audio.mp3" type="audio/mpeg">
            <source src="audio.ogg" type="audio/ogg">

            Trình duyệt không hỗ trợ audio.
        </audio>
    </section>

    <section>
        <h2>Logo SVG</h2>

        <svg width="220" height="120" xmlns="http://www.w3.org/2000/svg">

            <circle cx="60" cy="60" r="40" fill="blue"></circle>

            <rect x="120" y="25" width="70" height="70" fill="green"></rect>

            <text x="30" y="115" font-size="16">ShopTLU</text>

        </svg>
    </section>

</main>

<footer>
    <p>© 2026 ShopTLU</p>
</footer>

</body>
</html>
