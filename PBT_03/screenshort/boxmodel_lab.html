<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Lab</title>

    <link rel="stylesheet" href="boxmodel.css">
</head>
<body>

    <h1>Box Model Lab</h1>

    <!-- =========================
         PART 1
    ========================== -->

    <section>

        <h2>Part 1 — content-box vs border-box</h2>

        <div class="box-container">

            <!-- CONTENT BOX -->
            <div class="box content-box">
                <h3>Content Box</h3>

                <p>
                    box-sizing: content-box
                </p>
            </div>

            <!-- BORDER BOX -->
            <div class="box border-box">
                <h3>Border Box</h3>

                <p>
                    box-sizing: border-box
                </p>
            </div>

        </div>

    </section>

    <!-- =========================
         PART 2
    ========================== -->

    <section>

        <h2>Part 2 — 3 Column Layout</h2>

        <!-- WITHOUT BORDER-BOX -->
        <h3>Without border-box (Overflow)</h3>

        <div class="layout without-borderbox">

            <div class="sidebar">
                Sidebar
            </div>

            <div class="content">
                Main Content
            </div>

            <div class="ads">
                Ads
            </div>

        </div>

        <!-- WITH BORDER-BOX -->
        <h3>With border-box (Correct Layout)</h3>

        <div class="layout with-borderbox">

            <div class="sidebar">
                Sidebar
            </div>

            <div class="content">
                Main Content
            </div>

            <div class="ads">
                Ads
            </div>

        </div>

    </section>

</body>
</html>
